name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./engine
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p out
          go build -trimpath -ldflags "-s -w" -o out/make-it-green ./cmd/make-it-green
          (cd cmd/make-it-green-gui && wails build -skipbindings -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -tags webkit2_41)
          cp cmd/make-it-green-gui/build/bin/make-it-green-gui out/
          tar -czf make-it-green-${{ matrix.name }}.tar.gz -C out .

      - name: macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o out/cli-arm64 ./cmd/make-it-green
          GOARCH=amd64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o out/cli-amd64 ./cmd/make-it-green
          lipo -create -output out/make-it-green out/cli-arm64 out/cli-amd64 && rm out/cli-*
          (cd cmd/make-it-green-gui && wails build -skipbindings -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -platform darwin/universal)
          cp -R cmd/make-it-green-gui/build/bin/*.app out/
          # ad-hoc sign: an unsealed bundle shows "is damaged" on download. Developer ID + notarize removes the Gatekeeper prompt.
          codesign --force --deep -s - out/*.app out/make-it-green
          (cd out && zip -qry ../make-it-green-${{ matrix.name }}.zip .)

      - name: Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w" -o out/make-it-green.exe ./cmd/make-it-green
          (cd cmd/make-it-green-gui && wails build -skipbindings -trimpath -ldflags "-X main.version=${{ github.ref_name }}")
          cp cmd/make-it-green-gui/build/bin/make-it-green-gui.exe out/
          (cd out && 7z a ../make-it-green-${{ matrix.name }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: make-it-green-${{ matrix.name }}
          path: make-it-green-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: make-it-green-*
