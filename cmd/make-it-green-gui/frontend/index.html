<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make It Green</title>
<style>
  :root {
    --bg: #f4f6f3;
    --surface: #ffffff;
    --line: #e2e6df;
    --text: #141815;
    --muted: #616a62;
    --green: #3f9a1d;
    --green-soft: rgba(63, 154, 29, .14);
    --amber: #c27a00;
    --amber-soft: rgba(194, 122, 0, .14);
    --grey: #8b938c;
    --grey-soft: rgba(139, 147, 140, .16);
    --danger: #c43c31;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(20, 24, 21, .06), 0 8px 24px rgba(20, 24, 21, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1110;
      --surface: #181b19;
      --line: #262b27;
      --text: #ecefeb;
      --muted: #9aa39b;
      --green: #6cc644;
      --green-soft: rgba(108, 198, 68, .16);
      --amber: #f2a93b;
      --amber-soft: rgba(242, 169, 59, .16);
      --grey: #6d756e;
      --grey-soft: rgba(109, 117, 110, .2);
      --danger: #ff7b6e;
      --on-accent: #0f1110;
      --shadow: none;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  main { position: relative; max-width: 380px; margin: 0 auto; padding: 20px 16px; }
  .view { display: flex; flex-direction: column; gap: 16px; }
  main[data-view="home"] #settingsView, main[data-view="settings"] #homeView { display: none; }

  .icon-btn {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  }
  .icon-btn:hover { color: var(--text); background: var(--grey-soft); }
  .icon-btn svg { width: 20px; height: 20px; }
  #openSettings { position: absolute; top: 12px; right: 12px; z-index: 1; }
  .bar { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
  .bar h1 { font-size: 17px; }

  .link {
    appearance: none; border: 0; background: none; cursor: pointer; font: inherit; font-size: 12.5px;
    color: var(--muted); text-decoration: underline; text-underline-offset: 2px; align-self: center; margin-top: -8px;
  }
  .link:hover { color: var(--danger); }
  [data-state="off"] .link { visibility: hidden; }

  /* --- presence hero --- */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 4px; }
  .orb {
    --c: var(--grey); --soft: var(--grey-soft);
    position: relative; width: 120px; height: 120px; border-radius: 50%;
    background: var(--soft); display: grid; place-items: center;
    transition: background .3s;
  }
  .orb::before {
    content: ""; width: 52px; height: 52px; border-radius: 50%;
    background: var(--c); transition: background .3s, transform .25s;
    box-shadow: 0 0 0 6px var(--bg);
  }
  .orb::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--c); opacity: 0;
  }
  .orb svg { position: absolute; width: 76px; height: 76px; overflow: visible; }
  .leaf { transform-origin: 5px 59px; transform: scale(0) rotate(-40deg); opacity: 0; transition: transform .2s ease-in, opacity .2s; }
  .check { stroke-dasharray: 42; stroke-dashoffset: 42; transition: stroke-dashoffset .12s; }
  [data-state="active"] .orb { --c: var(--green); --soft: var(--green-soft); }
  [data-state="active"] .orb::before, [data-state="paused"] .orb::before { transform: scale(.4); }
  [data-state="active"] .orb::after { animation: pulse 2.6s ease-out .5s infinite; }
  /* paused: a yellow leaf; turning on grows the green leaf over it */
  [data-state="paused"] .autumn { transform: none; opacity: 1; transition: transform .38s cubic-bezier(.3, 1.6, .5, 1), opacity .1s; }
  [data-state="active"] .autumn { transform: none; opacity: 0; transition: opacity 0s .4s; }
  [data-state="active"] .green { transform: none; opacity: 1; transition: transform .38s cubic-bezier(.3, 1.6, .5, 1), opacity .1s; }
  /* paused -> active: the green leaf sits exactly on the yellow one and fades in, so the yellow
     leaf ripens to green in place and never peeks out; a small pop sells the change */
  [data-state="paused"] .green { transform: none; opacity: 0; transition: opacity .2s; }
  [data-state="active"][data-from="paused"] .green { transition: opacity .28s ease-out; }
  [data-state="active"][data-from="paused"] .orb svg { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { 40% { transform: scale(1.12); } }
  [data-state="active"] .check { stroke-dashoffset: 0; transition: stroke-dashoffset .22s cubic-bezier(.6, 0, .3, 1) .24s; }
  [data-state="paused"] .orb { --c: var(--amber); --soft: var(--amber-soft); }
  @keyframes pulse { from { transform: scale(.55); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .orb::after { animation: none !important; }
    .orb *, .orb::before { transition: none !important; animation: none !important; }
  }

  h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.45em; }

  .primary {
    appearance: none; border: 0; cursor: pointer; width: 100%;
    height: 44px; border-radius: 999px; font: inherit; font-weight: 600; font-size: 15px;
    background: var(--green); color: var(--on-accent);
    transition: filter .15s, background .3s, color .3s;
  }
  .primary:hover { filter: brightness(1.06); }
  .primary:active { filter: brightness(.95); }
  [data-state="active"] .primary, [data-state="paused"] .primary {
    background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line);
  }

  [data-held="true"] .primary { background: var(--green); color: var(--on-accent); box-shadow: none; }

  /* --- settings --- */
  section { display: flex; flex-direction: column; gap: 8px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; min-height: 46px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { display: flex; flex-direction: column; gap: 2px; }
  .hint { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .03em; vertical-align: 1px;
    color: var(--amber); background: var(--amber-soft);
  }
  .dim { opacity: .45; pointer-events: none; transition: opacity .2s; }

  /* switch */
  .switch { position: relative; flex: none; width: 40px; height: 24px; }
  .switch input { appearance: none; margin: 0; width: 100%; height: 100%; border-radius: 999px; background: var(--grey-soft); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background .2s; }
  .switch input:checked { background: var(--green); box-shadow: none; }
  .switch span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); pointer-events: none; transition: transform .2s; }
  .switch input:checked + span { transform: translateX(16px); }

  select, input[type="number"] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; height: 32px; padding: 0 8px; font-variant-numeric: tabular-nums;
  }
  input[type="number"] { width: 64px; text-align: right; appearance: textfield; -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stack { flex-direction: column; align-items: stretch; }
  .stack > .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  /* one row of equal chips, so both preset rows line up */
  .presets { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .presets button {
    appearance: none; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    height: 28px; padding: 0 4px; white-space: nowrap; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--muted); transition: background .15s, color .15s, border-color .15s;
  }
  .presets button:hover { color: var(--text); }
  .presets button[aria-pressed="true"] { background: var(--green-soft); border-color: transparent; color: var(--green); }
  .hours { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .unit { width: 2em; }

  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .error { color: var(--danger); font-size: 12.5px; text-align: center; padding: 0 8px; }
  .error:empty { display: none; }
</style>
</head>
<body>
<main id="app" data-state="off" data-view="home">
  <div class="view" id="homeView">
  <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="hero">
    <div class="orb" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <defs>
          <linearGradient id="leafFill" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#2f8a12"/><stop offset="1" stop-color="#7fd94f"/>
          </linearGradient>
          <linearGradient id="leafAutumn" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#b86e00"/><stop offset="1" stop-color="#f5c84a"/>
          </linearGradient>
          <!-- cuts the green leaf's veins away around the check, so they never cross it -->
          <mask id="aroundCheck" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
            <rect width="64" height="64" fill="#fff"/>
            <path d="M18 33L28 43L46 23" fill="none" stroke="#000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
          </mask>
        </defs>
        <g class="leaf autumn">
          <path d="M5 59L1 63" stroke="#b86e00" stroke-width="4" stroke-linecap="round"/>
          <path d="M5 59C5 15 15 5 59 5C59 49 49 59 5 59Z" fill="url(#leafAutumn)"/>
          <g fill="none" stroke="#a8640a" stroke-width="2.5" stroke-linecap="round" opacity=".8">
            <path d="M8 56Q30 36 52 12"/>
            <path d="M22 42L17 28M22 42L36 46M35 28L33 15M35 28L49 30"/>
          </g>
        </g>
        <g class="leaf green">
          <path d="M5 59L1 63" stroke="#3f9a1d" stroke-width="4" stroke-linecap="round"/>
          <path d="M5 59C5 15 15 5 59 5C59 49 49 59 5 59Z" fill="url(#leafFill)"/>
          <g fill="none" stroke="#1f6a0a" stroke-width="2.5" stroke-linecap="round" opacity=".45" mask="url(#aroundCheck)">
            <path d="M8 56Q30 36 52 12"/>
            <path d="M22 42L17 28M22 42L36 46M35 28L33 15M35 28L49 30"/>
          </g>
        </g>
        <path class="check" d="M18 33L28 43L46 23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 id="title" aria-live="polite">Off</h1>
    <p class="sub" id="sub">Your status goes Away when you are idle.</p>
  </div>

  <button class="primary" id="toggle">Keep me green</button>
  <button class="link" id="stop">Stop completely</button>
  <p class="error" id="error" role="alert"></p>
  <section>
    <h2>Schedule</h2>
    <div class="card">
      <label class="row">
        <span class="label">Only during work hours</span>
        <span class="switch"><input type="checkbox" id="schedule"><span></span></span>
      </label>
      <div class="row" id="hoursRow">
        <span class="label">Hours</span>
        <span class="hours">
          <select id="start" aria-label="Start hour"></select> –
          <select id="end" aria-label="End hour"></select>
        </span>
      </div>
      <label class="row" id="weekdaysRow">
        <span class="label">Weekdays only</span>
        <span class="switch"><input type="checkbox" id="weekdays"><span></span></span>
      </label>
    </div>
  </section>
  </div>

  <div class="view" id="settingsView">
  <div class="bar">
    <button class="icon-btn" id="closeSettings" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Settings</h1>
  </div>
  <section>
    <h2>Pause</h2>
    <div class="card">
      <div class="row">
        <span class="label">Pause button
          <span class="hint">Green turns back on by itself after the pause.</span>
        </span>
        <select id="pauseMode" aria-label="Pause length">
          <option value="next_day">Until next work day</option>
          <option value="minutes">For some minutes</option>
        </select>
      </div>
      <div class="row stack" id="pauseMinutesRow">
        <label class="top">
          <span class="label">Minutes</span>
          <span class="hours"><input type="number" id="pauseMinutes" min="1" max="1440" step="5"><span class="unit">min</span></span>
        </label>
        <div class="presets" id="pausePresets" role="group" aria-label="Pause presets">
          <button type="button" data-min="5">5 min</button>
          <button type="button" data-min="10">10 min</button>
          <button type="button" data-min="15">15 min</button>
          <button type="button" data-min="30">30 min</button>
          <button type="button" data-min="60">1 hour</button>
        </div>
      </div>
    </div>
  </section>
  <section>
    <h2>Behavior</h2>
    <div class="card">
      <div class="row stack">
        <label class="top">
          <span class="label">Nudge every
            <span class="hint">Teams goes Away after 5 minutes idle, Slack after 10. Max 4 minutes.</span>
          </span>
          <span class="hours"><input type="number" id="interval" min="5" max="240" step="5"><span class="unit">s</span></span>
        </label>
        <div class="presets" id="presets" role="group" aria-label="Nudge presets">
          <button type="button" data-sec="30">30 s</button>
          <button type="button" data-sec="60">1 min</button>
          <button type="button" data-sec="120">2 min</button>
          <button type="button" data-sec="180">3 min</button>
          <button type="button" data-sec="240">4 min</button>
        </div>
      </div>
      <label class="row">
        <span class="label"><span>Let the screen turn off<span class="badge">EXPERIMENTAL</span></span>
          <span class="hint">The computer stays awake, the screen sleeps. Turn off "lock when screen turns off", or your status goes Away.</span>
        </span>
        <span class="switch"><input type="checkbox" id="screenOff"><span></span></span>
      </label>
      <label class="row">
        <span class="label">Open at login
          <span class="hint">Starts working right away.</span>
        </span>
        <span class="switch"><input type="checkbox" id="autostart"><span></span></span>
      </label>
    </div>
  </section>

  </div>
</main>

<script>
  const App = () => window.go.main.App;
  const $ = id => document.getElementById(id);
  const pad = h => String(h).padStart(2, "0") + ":00";
  let cfg, running = false, held = false, since = null, state = "off";

  for (const sel of [$("start"), $("end")])
    for (let h = 0; h <= 24; h++) sel.add(new Option(pad(h), h));

  function showError(e) { $("error").textContent = e ? String(e) : ""; }

  function readForm() {
    return {
      ...cfg,
      schedule: $("schedule").checked,
      start_hour: +$("start").value,
      end_hour: +$("end").value,
      weekdays_only: $("weekdays").checked,
      interval_sec: clampInterval($("interval").value),
      screen_off: $("screenOff").checked,
      pause_mode: $("pauseMode").value,
      pause_minutes: Math.min(1440, Math.max(1, Math.round(+$("pauseMinutes").value) || 30)),
    };
  }

  // Same limits as engine.MinIntervalSec / MaxIntervalSec.
  const clampInterval = v => Math.min(240, Math.max(5, Math.round(+v) || 50));

  function markPreset() {
    for (const b of $("presets").children) b.setAttribute("aria-pressed", +b.dataset.sec === +$("interval").value);
    for (const b of $("pausePresets").children) b.setAttribute("aria-pressed", +b.dataset.min === +$("pauseMinutes").value);
  }

  function fillForm() {
    $("schedule").checked = cfg.schedule;
    $("start").value = cfg.start_hour;
    $("end").value = cfg.end_hour;
    $("weekdays").checked = cfg.weekdays_only;
    $("interval").value = cfg.interval_sec;
    $("screenOff").checked = cfg.screen_off;
    $("pauseMode").value = cfg.pause_mode;
    $("pauseMinutes").value = cfg.pause_minutes;
    dimSchedule();
    markPreset();
  }

  function dimSchedule() {
    const off = !$("schedule").checked;
    $("hoursRow").classList.toggle("dim", off);
    $("weekdaysRow").classList.toggle("dim", off);
    $("pauseMinutesRow").classList.toggle("dim", $("pauseMode").value !== "minutes");
  }

  function duration(ms) {
    const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60), h = Math.floor(m / 60);
    if (h) return `${h}h ${String(m % 60).padStart(2, "0")}m`;
    return m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`;
  }

  function render() {
    if ($("app").dataset.state !== state) $("app").dataset.from = $("app").dataset.state;
    $("app").dataset.state = state;
    $("app").dataset.held = held;
    $("toggle").textContent = held ? "Resume" : running ? "Pause" : "Keep me green";
    if (state === "active") {
      $("title").textContent = "You're green";
      const extra = cfg.screen_off ? " · screen may turn off" : "";
      $("sub").textContent = `Green for ${duration(Date.now() - since)}${extra}`;
    } else if (held) {
      $("title").textContent = "Paused";
      const until = new Date(cfg.paused_until), today = until.toDateString() === new Date().toDateString();
      const hm = until.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      $("sub").textContent = `Resumes ${today ? "at" : until.toLocaleDateString([], { weekday: "short" })} ${hm}`;
    } else if (state === "paused") {
      $("title").textContent = "Paused";
      $("sub").textContent = `Outside work hours · resumes at ${pad(cfg.start_hour)}`;
    } else {
      $("title").textContent = "Off";
      $("sub").textContent = "Your status goes Away when you are idle.";
    }
  }

  async function apply() {
    cfg = readForm();
    $("interval").value = cfg.interval_sec;
    markPreset();
    try {
      showError("");
      if (running) await App().Start(cfg); else await App().SaveConfig(cfg);
    } catch (e) { showError(e); }
    render();
  }

  // The engine "state" event re-renders after each call.
  $("toggle").addEventListener("click", async () => {
    try {
      showError("");
      cfg = await (running && !held ? App().Pause(readForm()) : App().Resume(readForm()));
    } catch (e) { showError(e); }
  });

  $("stop").addEventListener("click", async () => {
    try { showError(""); await App().Stop(); } catch (e) { showError(e); }
  });

  $("openSettings").addEventListener("click", () => $("app").dataset.view = "settings");
  $("closeSettings").addEventListener("click", () => $("app").dataset.view = "home");

  for (const id of ["schedule", "start", "end", "weekdays", "interval", "screenOff", "pauseMode", "pauseMinutes"])
    $(id).addEventListener("change", () => { dimSchedule(); apply(); });

  $("presets").addEventListener("click", e => {
    if (!e.target.dataset.sec) return;
    $("interval").value = e.target.dataset.sec;
    apply();
  });

  $("pausePresets").addEventListener("click", e => {
    if (!e.target.dataset.min) return;
    $("pauseMinutes").value = e.target.dataset.min;
    apply();
  });

  $("autostart").addEventListener("change", async e => {
    try { showError(""); await App().SetAutostart(e.target.checked); }
    catch (err) { showError(err); e.target.checked = !e.target.checked; }
  });

  const short = s => s.startsWith("active") ? "active" : s.startsWith("paused") ? "paused" : "off";

  window.runtime.EventsOn("state", async (s, err, greenSince) => {
    if (err) { showError(err); return; }
    since = greenSince || Date.now();
    state = short(s);
    running = state !== "off";
    held = s === "paused (by you)";
    try { cfg = { ...cfg, paused_until: (await App().GetConfig()).paused_until }; } catch {} // the tray can pause too
    render();
  });

  setInterval(() => state === "active" && render(), 1000);

  (async () => {
    try {
      cfg = await App().GetConfig();
      $("autostart").checked = await App().Autostart();
      const s = await App().State();
      state = short(s);
      running = state !== "off";
      held = s === "paused (by you)";
      since = (await App().GreenSince()) || Date.now();
    } catch (e) { showError(e); cfg = cfg || {}; }
    fillForm();
    render();
  })();
